name: StatsSync
main: com.homeofcappuccino.stats.StatsSyncPlugin
version: 1.0.0
api-version: "1.20"
softdepend:
  - Plan
  - WebStats
commands:
  statssync:
    description: Manage StatsSync tasks
    usage: /statssync reload | /statssync run <webstats|playerstats|planextensions>
    permission: statssync.admin
permissions:
  statssync.admin:
    default: op
